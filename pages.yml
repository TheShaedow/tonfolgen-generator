name: Publish Tonfolgen Generator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website bündeln
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
